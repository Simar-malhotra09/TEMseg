[[rules]]
label = "quasi-spherical"
conditions = [
    { metric = "solidity", op = ">", value = 0.92 },
    { metric = "circularity", op = ">", value = 0.70 },
]

[[rules]]
label = "elongated"
conditions = [
    { metric = "aspect_ratio", op = ">", value = 1.5 },
]

[[rules]]
label = "irregular"
conditions = [
    { metric = "solidity", op = "<", value = 0.85 },
]
