# Shape classification rules for TEM particle stats.
#
# Rules are evaluated top-to-bottom; the first rule whose conditions all
# match wins. If no rule matches, `default_shape` is used.
#
# Each condition is { metric = "...", op = "...", value = ... }
#   metric: "circularity" | "aspect_ratio" | "solidity" | "n_vertices"
#   op:     "<" | "<=" | ">" | ">=" | "==" | "!="
#
# Conditions within a rule are AND'ed together. To express OR, add another
# [[rules]] entry with the same label.
#
# For "==" / "!=" on float metrics (circularity, aspect_ratio, solidity),
# both sides are rounded to 2 decimal places before comparing.

# Used only when a particle matches none of the rules below — kept distinct
# from real category labels so rule gaps show up in shape_distribution
# instead of silently blending into a real category.
default_shape = "unclassified"

[[rules]]
label = "rod"
conditions = [
    { metric = "aspect_ratio", op = ">", value = 2.5 },
]

[[rules]]
label = "spherical"
conditions = [
    { metric = "circularity", op = ">", value = 0.90 },
    { metric = "solidity", op = ">", value = 0.95 },
    { metric = "aspect_ratio", op = "<", value = 1.2 },
]

# n_vertices-based faceted/triangular split disabled for now.
