[project]
name = "tem-particle-seg-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0.0",
  "opencv-python>=4.10.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "pydantic>=2.10.0",
  "ultralytics>=8.3.0",
  "segment-anything>=1.0",
  "scipy>=1.13.0",
  "tifffile>=2024.1.1",
  "python-dotenv>=1.0.0",
  "python-multipart>=0.0.9",
  "onnx>=1.16.0",
  "onnxruntime>=1.24.3",
  "pywebview>=6.1",
  "hyperspy>=2.4.0",
  "numba>=0.64.0",
  "matplotlib>=3.10.8",
  "lap>=0.5.13",
  "scikit-learn>=1.5.0",
  "scikit-image>=0.24.0",
  # pywin32 only on Windows — pywebview's EdgeChromium backend uses COM
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  # "onnxruntime-gpu>=1.24.3",

]

# ── torch is installed separately via install.py ─────────────────────────────
# Do NOT add torch/torchvision here — the correct CUDA/CPU/MPS variant
# must be selected at install time based on platform and GPU availability.
# See install.py at the project root.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
